security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      form_login:
        login_path: login
        check_path: login
        enable_csrf: true
        default_target_path: home

      remember_me:
        secret: "%kernel.secret"
        lifetime: 604800

      logout:
        path: logout
        target: home
